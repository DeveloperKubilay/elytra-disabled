# ===================================================================
# Формат сообщений
# ===================================================================
# Строка = сообщение в чат без звука (пример: reload_success).
# Для actionbar/title/звука - список строк: первая в [квадратных скобках] задаёт
# настройки, остальные - текст (с & цветами):
#
# equip_blocked:
#   - '[type="title",title_times="10:40:10",sound="minecraft:entity.villager.no;1.0;1.0"]'
#   - '&cУпс!'
#   - '&7Здесь нельзя надевать элитры'
#
# type: chat (по умолчанию) / actionbar / title
# title_times: "появление:показ:исчезновение" в тиках (20 = 1 сек), только для title
# sound: "звук;громкость;высота" - minecraft:entity.villager.no или ENTITY_VILLAGER_NO,
#        громкость/высота необязательны
# chat шлёт все строки, actionbar - только первую, title - первую и вторую (подзаголовок)
#
# Отключить сообщение: значение -> false (НЕ удалять и не комментировать ключ - при
# /reload плагин восстановит отсутствующие ключи из дефолтов, а false не тронет):
#
# equip_blocked: false
# ===================================================================

# Сообщение при попытке надеть элитры
equip_blocked:
  - '[type="title",title_times="10:40:10",sound="minecraft:entity.villager.no;1.0;1.0"]'
  - '&cУпс!'
  - '&7Здесь нельзя надевать элитры'

# Сообщение при попытке полететь
glide_blocked:
  - '[type="title",title_times="10:40:10",sound="minecraft:entity.villager.no;1.0;1.0"]'
  - '&cУпс!'
  - '&7Полёты на элитрах тут запрещены'

# Сообщение при автоматическом снятии элитр
removed_on_enter: "&eВаши элитры были сняты при входе в этот мир."

# Сообщения при перезагрузке плагина
reload_success: "&a&l[ElytraDisabled]&r &aКонфигурация успешно перезагружена!"
reload_error: "&c&l[ElytraDisabled]&r &cОшибка при перезагрузке конфигурации!"

# Сообщение помощи по команде
help_reload: "&e/elytra-disabled reload &8- &7Перезагрузить конфигурацию"

# Сообщение при отсутствии прав
no_permission: "&cУ вас нет прав для использования этой команды!"
