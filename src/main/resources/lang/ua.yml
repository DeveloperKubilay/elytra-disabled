# ===================================================================
# Формат повідомлень
# ===================================================================
# Рядок = повідомлення в чат без звуку (приклад: reload_success).
# Для actionbar/title/звуку - список рядків: перший у [квадратних дужках] задає
# налаштування, решта - текст (з & кольорами):
#
# equip_blocked:
#   - '[type="title",title_times="10:40:10",sound="minecraft:entity.villager.no;1.0;1.0"]'
#   - '&cОй!'
#   - '&7Тут не можна одягати елітри'
#
# type: chat (за замовчуванням) / actionbar / title
# title_times: "поява:показ:зникнення" у тіках (20 = 1 сек), лише для title
# sound: "звук;гучність;висота" - minecraft:entity.villager.no або ENTITY_VILLAGER_NO,
#        гучність/висота необов'язкові
# chat надсилає всі рядки, actionbar - лише перший, title - перший і другий (підзаголовок)
#
# Вимкнути повідомлення: значення -> false (НЕ видаляти і не коментувати ключ - при
# /reload плагін відновлює відсутні ключі з дефолтів, а false не чіпає):
#
# equip_blocked: false
# ===================================================================

# Повідомлення при спробі надіти елітри
equip_blocked:
  - '[type="title",title_times="10:40:10",sound="minecraft:entity.villager.no;1.0;1.0"]'
  - '&cОй!'
  - '&7Тут не можна одягати елітри'

# Повідомлення при спробі летіти
glide_blocked:
  - '[type="title",title_times="10:40:10",sound="minecraft:entity.villager.no;1.0;1.0"]'
  - '&cОй!'
  - '&7Політ на елітрах тут заборонено'

# Повідомлення при автоматичному знятті елітр
removed_on_enter: "&eВаші елітри були зняті при вході в цей світ."

# Повідомлення при перезавантаженні плагіна
reload_success: "&a&l[ElytraDisabled]&r &aКонфігурацію успішно перезавантажено!"
reload_error: "&c&l[ElytraDisabled]&r &cПомилка при перезавантаженні конфігурації!"

# Повідомлення допомоги по команді
help_reload: "&e/elytra-disabled reload &8- &7Перезавантажити конфігурацію"

# Повідомлення про відсутність прав
no_permission: "&cУ вас немає прав для використання цієї команди!"

# Текст плейсхолдерів PlaceholderAPI (%elytradisabled_world_disabled%, %elytradisabled_bypass%,
# %elytradisabled_blocked%) для значень true/false - можна замінити на "Так"/"Ні" тощо.
placeholder_true: "true"
placeholder_false: "false"
